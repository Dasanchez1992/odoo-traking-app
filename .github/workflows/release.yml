name: Publicar release de Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publicar:
    name: Construir y publicar instalador
    runs-on: windows-latest
    # Sin esto, una subida atascada deja el workflow corriendo hasta el límite de 6 horas.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo hace falta para listar los commits desde la versión anterior.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Comprobar el token de publicación
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "Falta el secret RELEASES_TOKEN."
            echo "Crea un token con permiso de contenido sobre el repositorio de instaladores"
            echo "y guárdalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que la etiqueta coincide con la versión de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$etiqueta" != "$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de package.json."
            echo "Actualiza la versión (npm version) antes de etiquetar."
            exit 1
          fi

      - name: Revisar tipos de TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Compilar la interfaz
        run: npm run build

      # Se construye sin publicar: el uploader propio de electron-builder se cuelga subiendo
      # el instalador, así que los archivos se suben después con gh, que sí reintenta y avisa.
      - name: Construir el instalador
        run: npx electron-builder --win --publish never

      - name: Comprobar los archivos a publicar
        shell: bash
        run: |
          ls -lh release/ || true
          if [ ! -f release/latest.yml ]; then
            echo "No se generó release/latest.yml; sin él la app no detecta actualizaciones."
            exit 1
          fi

      - name: Redactar las notas con los commits de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          anterior=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          {
            echo "## Novedades"
            echo
            if [ -n "$anterior" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${anterior}..${GITHUB_REF_NAME}" \
                | grep -v '^- Versión ' || echo "- Sin cambios registrados"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}" \
                | grep -v '^- Versión ' || echo "- Primera versión"
            fi
            echo
            echo
            echo "## Instalación"
            echo
            echo "Descarga \`Elideysi-${GITHUB_REF_NAME#v}-setup.exe\`. Windows mostrará un aviso de"
            echo "SmartScreen porque el instalador no está firmado: elige «Más información» y"
            echo "«Ejecutar de todas formas». Si ya tienes la aplicación instalada, se actualiza sola."
            if [ -n "$anterior" ]; then
              echo
              echo "**Todos los cambios**: https://github.com/${GITHUB_REPOSITORY}/compare/${anterior}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      # El instalador queda descargable desde Actions aunque la publicación falle.
      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: elideysi-instalador
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Crear el release en el repositorio de instaladores
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          repo=$(node -p "const p=require('./package.json').build.publish[0]; p.owner + '/' + p.repo")
          tag="${GITHUB_REF_NAME}"
          echo "repo=$repo" >> "$GITHUB_ENV"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "El release ya existe; se actualizan las notas."
            gh release edit "$tag" --repo "$repo" --notes-file release-notes.md
          else
            gh release create "$tag" --repo "$repo" --title "$tag" --notes-file release-notes.md
          fi

      # Los archivos se suben por separado y uno a uno: así el log dice cuál falla y cuánto
      # tarda, en vez de quedarse en una única operación opaca que puede colgarse.
      - name: Subir los archivos al release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          subir_url=$(gh release view "$tag" --repo "$repo" --json uploadUrl --jq .uploadUrl | sed 's/{.*}//')

          for archivo in release/latest.yml release/*.exe release/*.blockmap; do
            [ -f "$archivo" ] || continue
            nombre=$(basename "$archivo")
            echo "Subiendo $nombre ($(stat -c %s "$archivo") bytes)..."
            curl -sS --fail-with-body --max-time 900 \
              -X POST "${subir_url}?name=${nombre}" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$archivo" \
              -o /dev/null -w "  hecho en %{time_total}s (HTTP %{http_code})\n"
          done

          echo "Publicado:"
          gh release view "$tag" --repo "$repo" --json assets --jq '.assets[] | "\(.name) — \(.size) bytes"'
